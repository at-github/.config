backend = "glx"
unredir-if-possible = false;
#
# BLUR
blur-method = "box"
blur-size = 4
blur-background = true
blur-background-exclude = [
  "class_g = 'Dunst'"
];
fade-delta= 5;
vsync = true;
fading = true;
# No fade for dunst and the eww OSD: the volume/media OSD must react instantly
# (eww recreates the OSD window on each key press)
fade-exclude = [
  "class_g = 'Dunst'",
  "name = 'Eww - osd'"
];
use-damage = true;

# OPACITY
# inactive-opacity = 0.90;
# frame-opacity = 0.90
# active-opacity = 1.0;

# except browsers
opacity-rule = [
  "100:class_g *= 'Brave' && !focused",
  "100:class_g *= 'Chrome' && !focused",
  "100:class_g *= 'eww' && !focused"
];

# SHADOW
shadow = true;
shadow-opacity = 0.1;
shadow-offset-y = 0.2;
shadow-radius = 10;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "class_g = 'eww'",
  "class_g = 'Dunst'"
];
# Frame pacing delays newly mapped windows (OSD)
frame-pacing = false;
