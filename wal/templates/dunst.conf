# pywal template rendered to ~/.cache/wal/dunst.conf, loaded by dunst
# through ~/.config/dunst/dunstrc.d/50-wal.conf (symlink).
# Run `dunstctl reload` after `wal`.
# Dark background, readable text, accent frame. These rules override the
# [urgency_*] sections of dunstrc.

[wal-low]
    msg_urgency = low
    background = "{background}"
    foreground = "{color8}"
    frame_color = "{background}"
    highlight = "{color8}"

[wal-normal]
    msg_urgency = normal
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color2}"
    highlight = "{color2}"

# Frame stays red: wal palettes do not guarantee a red-ish color.
[wal-critical]
    msg_urgency = critical
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "#ff0000"
    highlight = "#ff0000"
